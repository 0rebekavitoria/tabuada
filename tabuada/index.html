<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabuada Colorida</title>
  <link rel="stylesheet" href="exe.css" />
</head>
<body>
  <main class="container">
    <div class="badge">✨ Matemática divertida</div>
    <h1>Tabuada Colorida</h1>
    <p class="subtitle">Descubra a tabuada de qualquer número em segundos.</p>

    <label for="numero" class="sr-only">Digite um número</label>
    <input
      type="number"
      id="numero"
      placeholder="Digite um número"
      min="0"
    />

    <button id="btnCalcular">Calcular</button>

    <div id="resultado" class="resultado" aria-live="polite"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
