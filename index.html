<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validação de Entrada no Evento</title>
  <link rel="stylesheet" href="exe.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎉 Evento</h1>
      <p class="subtitle">Verifique sua entrada</p>
    </div>

    <div class="form-group">
      <label for="idade">Qual é sua idade?</label>
      <input 
        type="number" 
        id="idade" 
        placeholder="Digite sua idade" 
        min="0"
        max="150"
      />
    </div>

    <button id="btnVerificar">Verificar Entrada</button>

    <div id="mensagem" class="mensagem"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
